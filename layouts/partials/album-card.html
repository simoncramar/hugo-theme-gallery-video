{{ $gallery := partial "get-gallery.html" . }}
{{ with $gallery }}
  {{ $countKey := cond (eq .page.Section "videos") "videoCount" "photoCount" }}
  <a class="card" href="{{ .page.RelPermalink }}" title="{{ .page.Title }}">
    <figure style="background-color: {{ .color }}">
      <img class="lazyload" width="{{ .thumbnail.Width }}" height="{{ .thumbnail.Height }}" data-src="{{ .thumbnail.RelPermalink }}" alt="{{ .page.Title }}" />
      <span class="card-badge">
        {{ if gt .albumCount 0 }}
          {{ T "albumCount" (dict "count" (.albumCount | lang.FormatNumber 0) "photoCount" (.imageCount | lang.FormatNumber 0 | lang.Translate $countKey)) }}
        {{ else }}
          {{ T $countKey (.imageCount | lang.FormatNumber 0) }}
        {{ end }}
      </span>
    </figure>
    <div>
      <h2>{{ .page.Title }}</h2>
    </div>
  </a>
{{ end }}
